name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Sy --noconfirm base-devel git python python-pip python-pillow python-numpy python-trimesh python-shapely python-manifold3d python-matplotlib

      - name: Build binary
        run: |
          pip install --break-system-packages pyinstaller
          pyinstaller --onefile --name stitching-template \
            --add-data "assets/kirby.png:assets" \
            src/main.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stitching-template-binary
          path: dist/stitching-template

  build-package:
    needs: build-binary
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Sy --noconfirm base-devel git fakeroot

      - name: Setup builder
        run: |
          useradd -m builder
          cp -a . /home/builder/src
          chown -R builder:builder /home/builder/src

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: stitching-template-binary
          path: dist/

      - name: Prepare sources
        run: |
          cp dist/stitching-template stitching-template-bin
          cp assets/kirby.png kirby.png-asset
          chown -R builder:builder /home/builder/src

      - name: Build package
        run: |
          su builder -c "cd /home/builder/src && makepkg -sf --noconfirm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stitching-template-pkg
          path: /home/builder/src/stitching-template-*.pkg.tar.zst

  release:
    needs: build-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stitching-template-pkg
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}